<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OverWatchRP — подключение</title>
  <style>
    :root{--blue:#38b9ff;--blue2:#0b72be;--ink:#020914;--panel:rgba(2,13,29,.86);--line:rgba(71,190,255,.38);--text:#eef9ff;--muted:#8fb0c5}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020711;font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
    body{background:linear-gradient(105deg,rgba(0,5,13,.96) 0%,rgba(0,10,23,.68) 45%,rgba(0,4,11,.82) 100%),url("background.png") center/cover no-repeat}
    body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 36%,rgba(28,150,225,.19),transparent 34%),repeating-linear-gradient(0deg,rgba(80,190,255,.025) 0 1px,transparent 1px 5px);animation:breath 5s ease-in-out infinite alternate}
    body:after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 42%,rgba(77,188,255,.07) 50%,transparent 58%);animation:sweep 7s linear infinite;pointer-events:none}
    .grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(54,177,245,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(54,177,245,.12) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to right,#000,transparent 72%)}
    .brand{position:absolute;left:5.5vw;top:8vh;padding-left:22px;border-left:4px solid var(--blue)}
    .brand small{display:block;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:4px;margin-bottom:9px}.brand h1{font-size:46px;line-height:1;margin:0;font-weight:800;letter-spacing:1px}.brand p{margin:12px 0 0;color:var(--muted);font-size:13px;letter-spacing:2px}
    .telemetry{position:absolute;right:5vw;top:8vh;text-align:right;color:#72cfff;font:700 11px Consolas,monospace;line-height:1.65;letter-spacing:1px}.telemetry b{color:white}
    .shell{position:absolute;left:5.5vw;right:5.5vw;bottom:7vh;min-height:178px;background:linear-gradient(110deg,rgba(3,17,36,.94),rgba(4,25,48,.79));border:1px solid var(--line);box-shadow:0 22px 80px #000b,inset 0 1px rgba(255,255,255,.04);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));padding:28px 34px 24px}
    .shell:before,.shell:after{content:"";position:absolute;background:var(--blue)}.shell:before{left:0;top:0;width:5px;height:58px}.shell:after{right:0;bottom:0;width:58px;height:3px}
    .eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:3px}.status{margin-top:10px;font-size:25px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file{height:21px;margin-top:6px;color:var(--muted);font:12px Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track{position:relative;height:8px;margin-top:22px;background:rgba(77,170,225,.13);overflow:hidden}.bar{height:100%;width:8%;background:linear-gradient(90deg,#096caf,#55caff);box-shadow:0 0 18px #35baff;transition:width .45s ease}.bar.indeterminate{width:32%;animation:loading 1.8s ease-in-out infinite}
    .meta{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font:700 11px Consolas,monospace;letter-spacing:1px}.meta strong{color:#cceeff}
    .dot{display:inline-block;width:7px;height:7px;margin-right:9px;background:var(--blue);box-shadow:0 0 11px var(--blue);animation:blink 1.1s steps(2) infinite}
    @keyframes loading{0%{transform:translateX(-110%)}100%{transform:translateX(420%)}}@keyframes sweep{to{transform:translateX(45%)}}@keyframes breath{to{opacity:.72}}@keyframes blink{50%{opacity:.25}}
  </style>
</head>
<body>
  <div class="grid"></div>
  <header class="brand"><small>ГРАЖДАНСКАЯ СЕТЬ // C17</small><h1>OVERWATCH<span style="color:var(--blue)">RP</span></h1><p>HALF-LIFE 2 ROLEPLAY • ЗАЩИЩЁННОЕ СОЕДИНЕНИЕ</p></header>
  <div class="telemetry">КАНАЛ <b>17-B</b><br>ПРОТОКОЛ <b>OWR/2</b><br>СОСТОЯНИЕ <b>СИНХРОНИЗАЦИЯ</b></div>
  <main class="shell">
    <div class="eyebrow"><span class="dot"></span>ТЕРМИНАЛ ПОДКЛЮЧЕНИЯ</div>
    <div id="status" class="status">Устанавливается соединение с сервером…</div>
    <div id="file" class="file">Ожидание данных сервера</div>
    <div class="track"><div id="bar" class="bar indeterminate"></div></div>
    <div class="meta"><span id="server">OVERWATCHRP // CITY 17</span><span id="counter"><strong>ПОДГОТОВКА</strong></span></div>
  </main>
  <script>
    const statusEl=document.getElementById('status'),fileEl=document.getElementById('file'),barEl=document.getElementById('bar'),counterEl=document.getElementById('counter'),serverEl=document.getElementById('server');
    let total=0,needed=0;
    function refresh(){if(total>0){const done=Math.max(0,total-needed),percent=Math.max(0,Math.min(100,done/total*100));barEl.classList.remove('indeterminate');barEl.style.width=percent+'%';counterEl.innerHTML='<strong>'+Math.round(percent)+'%</strong> • '+done+' / '+total+' ФАЙЛОВ'}}
    window.GameDetails=function(serverName,serverUrl,mapName,maxPlayers,steamId,gameMode){serverEl.textContent=(serverName||'OVERWATCHRP')+' // '+(mapName||'CITY 17').toUpperCase()};
    window.SetStatusChanged=function(text){statusEl.textContent=text||'Синхронизация данных…'};
    window.DownloadingFile=function(file){fileEl.textContent=file?'Загрузка: '+file:'Проверка ресурсов…'};
    window.SetFilesTotal=function(value){total=Number(value)||0;refresh()};
    window.SetFilesNeeded=function(value){needed=Number(value)||0;refresh()};
  </script>
</body>
</html>
