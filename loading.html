<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        body {
            background:
                linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.65)),
                url("background.png") center / cover no-repeat;
        }

        .status {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 20px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px black;
        }
    </style>
</head>
<body>
    <div id="status" class="status">Подключение к AllienceRP...</div>

    <script>
        window.SetStatusChanged = function(text) {
            document.getElementById("status").textContent = text;
        };
    </script>
</body>
</html>
